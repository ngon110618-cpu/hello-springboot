<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sinh Viên</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5 mb-5">
    <h2 class="text-center mb-4 text-primary fw-bold">QUẢN LÝ SINH VIÊN</h2>

    <!-- Form Thêm / Sửa Sinh Viên -->
    <div class="card shadow mb-4">
        <div class="card-header font-weight-bold text-white"
             th:classappend="${editingStudent.id != null} ? 'bg-warning text-dark' : 'bg-primary'">
            <span th:text="${editingStudent.id != null} ? 'Cập Nhật Thông Tin Sinh Viên' : 'Thêm Sinh Viên Mới'"></span>
        </div>
        <div class="card-body">
            <form th:action="@{/students-view/save}" th:object="${editingStudent}" method="post" class="row g-3">
                <!-- Field ẩn lưu ID khi Edit -->
                <input type="hidden" th:field="*{id}" />

                <div class="col-md-3">
                    <label class="form-label fw-bold">Mã SV</label>
                    <input type="text" th:field="*{maSV}" class="form-control" placeholder="VD: SV011" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Họ và Tên</label>
                    <input type="text" th:field="*{hoTen}" class="form-control" placeholder="VD: Nguyễn Văn A" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="VD: a@gmail.com" required>
                </div>
                <div class="col-md-2 d-flex align-items-end gap-2">
                    <button type="submit" class="btn w-100"
                            th:classappend="${editingStudent.id != null} ? 'btn-warning' : 'btn-success'"
                            th:text="${editingStudent.id != null} ? 'Lưu' : 'Thêm mới'"></button>
                    <a th:if="${editingStudent.id != null}" th:href="@{/students-view}" class="btn btn-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bảng Danh Sách Sinh Viên -->
    <div class="card shadow">
        <div class="card-header bg-dark text-white font-weight-bold">
            Danh Sách Sinh Viên
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Mã SV</th>
                    <th>Họ và Tên</th>
                    <th>Email</th>
                    <th>ID (UUID)</th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.maSV}" class="fw-bold"></td>
                    <td th:text="${student.hoTen}"></td>
                    <td th:text="${student.email}"></td>
                    <td th:text="${student.id}" class="text-muted small"></td>
                    <td class="text-center">
                        <a th:href="@{/students-view/edit/{id}(id=${student.id})}"
                           class="btn btn-warning btn-sm me-1">Sửa</a>
                        <a th:href="@{/students-view/delete/{id}(id=${student.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa sinh viên này?');">Xóa</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
